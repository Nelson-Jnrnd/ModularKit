name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore ModularKit.slnx
      - run: python scripts/check_docs.py
      - run: dotnet build ModularKit.slnx -c Release --no-restore
      - run: dotnet test ModularKit.slnx -c Release --no-build --logger "trx;LogFileName=tests.trx"
      - run: dotnet pack ModularKit.slnx -c Release --no-build -o artifacts/packages
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}
          path: artifacts/packages/*.nupkg
